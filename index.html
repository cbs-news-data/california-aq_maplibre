<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
<script type="text/javascript" src="https://pym.nprapps.org/pym.v1.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@2.3.0/dist/maplibre-gl.css" />

<!-- Fonts -->
<link rel="stylesheet" href="https://use.typekit.net/rdn8fde.css" />
<style>
  @font-face {
    font-family: "Publico Headline";
    src: url("fonts/PublicoHeadline-Black.woff2") format("woff2"),
      url("fonts/PublicoHeadline-Black.woff") format("woff");
  }


  body {
    margin: 0 !important;
  }

  a {
    text-decoration: underline;
    text-decoration-color: #A5091E;
    color: #858585;
  }

  a:hover {
    cursor: pointer;
    color: #A5091E
  }

  a#source {
    color: #858585;
    text-decoration: none;
  }

  #container {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #header {
    z-index: 1;
    max-width: 980px;
  }

  .title {
    font-family: "Publico Headline", serif;
    line-height: 34px;
    font-size: 32px;
    color: rgb(0, 0, 0);
  }

  .description {
    font-family: "proxima-nova", sans-serif;
    font-size: 16px;
    line-height: 1.3;
    max-width: 980px;
    margin-top: 12px;
  }

  .legend {
    display: flex;
    align-items: center;
    font-family: "proxima-nova", sans-serif;
    font-size: 14px;
    margin-bottom: 5px;
  }

  span.legend-title {
    font-size: 16px;
    font-family: "proxima-nova", sans-serif;
  }

  .legend div {
    width: 15px;
    height: 15px;
    margin-right: 5px;
    border-radius: 2px;
  }

  .legend span {
    margin-right: 5px;
    font-family: "proxima-nova", sans-serif;
  }

  .good {
    background-color: #70bb6e;
  }

  .moderate {
    background-color: #fde633;
  }

  .unhealthy-sg {
    background-color: #fd8724;
  }

  .unhealthy {
    background-color: #a5091e;
  }

  .very-unhealthy {
    background-color: #8b09a5;
  }

  .hazardous {
    background-color: #876035;
  }

  .none {
    background-color: #cccccc;
    margin-left: 15px;
  }

  #map {
    flex-grow: 1;
    max-height: 600px;
    max-width: 980px;
    margin-bottom: 12px;
  }

  button.maplibregl-ctrl-compass {
    display: none !important;
  }


  /* MEDIA QUERY */
  @media (max-width: 430px) {
    #map {
      max-height: 900px !important;
    }

    .description {
      margin-bottom: 10px;
    }

    .legend {
      display: flex;
      align-items: center;
      font-family: "proxima-nova", sans-serif;
      font-size: 14px;
      margin-bottom: 5px;
    }

    span.legend-title {
      font-size: 14px;
      font-family: "proxima-nova", sans-serif;
    }

    .legend div {
      width: 15px;
      height: 15px;
      margin-right: 4px;
      border-radius: 2px;
    }

    .legend span {
      font-family: "proxima-nova", sans-serif;
    }

    .none {
      background-color: #cccccc;
      margin-left: 10px;
    }
  }

  .note {
    font-family: "proxima-nova", sans-serif;
    font-size: 16px;
  }

  .source {
    font-family: "proxima-nova", sans-serif;
    color: rgb(130, 130, 130);
    font-size: 14px;
  }
</style>

<div id="container">
  <div id="header">
    <div class="title">Current air quality near SoCal fires</div>
    <p class="description">
      This map shows the current air quality in the SoCal area, based on ozone and PM2.5 levels. Click
      <a href="https://www.airnow.gov/aqi/aqi-basics/" target="_blank">here</a>
      to understand what the Air Quality Index (AQI) ratings mean.
    </p>
    <div class="legend">
      <span>Good</span>
      <div class="good"></div>
      <div class="moderate"></div>
      <div class="unhealthy-sg"></div>
      <div class="unhealthy"></div>
      <div class="very-unhealthy"></div>
      <div class="hazardous"></div>
      <span>Hazardous</span>
      <div class="none"></div>
      <span>No data</span>
    </div>
  </div>
  <div id="map"></div>
  <div class="source">
    Map: Taylor Johnston / CBS News • Source:
    <a href="https://gispub.epa.gov/airnow/?showlegend=yes&archivedates=07%2F14%2F2024&monitors=none&boundaries=nps%2Fcounty&tab=current&basemap=imagery&showgreencontours=true&xmin=-13594901.422994448&xmax=-8311574.027924468&ymin=1022153.4939335962&ymax=9044983.982743563"
      target="_blank" id="source">AirNow</a>
  </div>
</div>

<script>
  const map = new maplibregl.Map({
    container: "map",
    style:
      "https://raw.githubusercontent.com/go2garret/maps/main/src/assets/json/openStreetMap.json", // Replace with your MapTiler style URL
    center: [-118.54952, 34.05664], // Centered on the Palisades fire
    zoom: 5, // Dynamically set initial zoom
    maxZoom: 10,
    minZoom: 3,
  });


  // Disable scroll zoom
  map.scrollZoom.disable();

  // Add zoom and rotation controls to the map.
  map.addControl(new maplibregl.NavigationControl(), "top-left");

  map.on("load", () => {
    const layers = map.getStyle().layers;
    // Find the index of the first symbol layer in the map style
    let firstSymbolId;
    for (let i = 0; i < layers.length; i++) {
      if (layers[i].type === "symbol") {
        firstSymbolId = layers[i].id;
        break;
      }
    }

      //  add california shapefile
  // map.addSource("california", {
  //   type: "geojson",
  //   data: "data/CA_State.geojson",  // Your GeoJSON file
  // });

  // map.addLayer({
  //   id: "california-layer",
  //   type: "line",  // Use fill for polygons
  //   source: "california",
  //   paint: {
  //     "line-color": "#000",
  //     "line-width": 1,
  //   },
  // });

    map.addSource("shapefile", {
      type: "geojson",
      data: "https://raw.githubusercontent.com/cbs-news-data/air-quality_maplibre/refs/heads/main/data/airnow_aq.geojson", // Your GeoJSON data URL
    });

    map.addLayer(
      {
        id: "shapefile-layer",
        type: "fill",
        source: "shapefile",
        paint: {
          "fill-color": [
            "match",
            ["get", "gridcode"],
            1,
            "#70bb6e",
            2,
            "#fde633",
            3,
            "#fd8724",
            4,
            "#a5091e",
            5,
            "#8b09a5",
            6,
            "#876035",
            "#cccccc",
          ],
          "fill-opacity": 0.3,
        },
      },
      firstSymbolId
    ); // Pass firstSymbolId as the second argument
  });


  document.addEventListener("DOMContentLoaded", function () {
    var pymChild = new pym.Child();
    pymChild.sendHeight();
  });
</script>
